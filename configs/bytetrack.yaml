# Keep low-confidence detections for second-stage association, but require
# stronger evidence to start a new identity. Evaluated in compare_motion_tracking.
tracker_type: bytetrack
track_high_thresh: 0.4
track_low_thresh: 0.1
new_track_thresh: 0.4
track_buffer: 30
match_thresh: 0.8
fuse_score: true
